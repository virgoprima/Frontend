<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Скоро — pettogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Jost:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
  :root{--green:#24324A;--green-dark:#1A2538;--green-pale:#E8ECF2;--green-mist:#F3F1EC;--ink:#22262E;--ink-soft:#696C73;--line:#E5E2DC;--paper:#FAF8F4;--coral:#E06A4E;--coral-text:#C4543A;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Jost","Helvetica Neue",Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1240px;margin:0 auto;padding:0 28px;width:100%}
  .topbar{background:var(--green);color:#fff;text-align:center;font-family:var(--serif);font-size:17px;padding:7px 16px}
  header.site{background:var(--paper);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;gap:20px;padding:12px 0}
  .logo{display:flex;align-items:center;gap:12px}
  .logo-mark{width:54px;height:auto;display:block}
  .logo-text{font-family:var(--serif);font-size:28px;font-weight:500;color:var(--green);line-height:1}
  .menu{display:flex;gap:28px;font-size:15px;font-weight:400;margin-left:auto}
  .menu a{position:relative;padding:4px 0;white-space:nowrap}
  .menu a::after{content:"";position:absolute;left:0;right:100%;bottom:-2px;height:1px;background:var(--coral);transition:right .25s}
  .menu a:hover{color:var(--green)}
  .menu a:hover::after,.menu a.cur::after{right:0}
  .menu a.cur{color:var(--green)}
  @media (max-width:1020px){.nav{flex-wrap:wrap}.menu{order:3;width:100%;margin-left:0;overflow-x:auto;gap:22px;padding:4px 0 2px;scrollbar-width:none}.menu::-webkit-scrollbar{display:none}}

  main{flex:1;display:flex;align-items:center;padding:64px 0}
  .box{max-width:640px}
  .kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--coral-text);display:block;margin-bottom:14px}
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(40px,5vw,60px);line-height:1.1;color:var(--green);margin-bottom:16px}
  p{color:var(--ink-soft);margin-bottom:12px}
  ul{margin:8px 0 24px 20px;color:var(--ink)}
  li{margin-bottom:6px}
  .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
  .btn{display:inline-flex;align-items:center;padding:13px 24px;border-radius:4px;font-weight:400;font-size:14px;letter-spacing:.04em;border:1px solid var(--green)}
  .btn-green{background:var(--green);color:#fff}.btn-outline{color:var(--green)}
  .btn:hover{opacity:.9}
  @media (max-width:640px){.wrap{padding:0 16px}.logo-text{font-size:24px}}
</style>
</head>
